version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fornax_db
    environment:
      POSTGRES_USER: fornax_user
      POSTGRES_PASSWORD: fornax_pass
      POSTGRES_DB: fornax_db
    ports:
      - "5432:5432"
    volumes:
      - fornax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fornax_user -d fornax_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fornax_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./checkpoints:/app/checkpoints
      - ./tokenizer_data:/app/tokenizer_data
    depends_on:
      db:
        condition: service_healthy

volumes:
  fornax_pg_data: